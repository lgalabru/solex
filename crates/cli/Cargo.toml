[package]
name = "solex"
description = "solex CLI: build and deploy Solana programs per release channel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "solex"
path = "src/main.rs"

[dependencies]
solex-core = { workspace = true }
solex-mcp = { workspace = true }
tokio = { workspace = true }
solex-types = { workspace = true, features = ["yaml", "toml", "spec"] }
clap = { workspace = true }
clap_complete = { workspace = true }
console = { workspace = true }
indicatif = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
