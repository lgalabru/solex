# Fixture manifest for the native tests, in TOML to exercise that path
# (the example uses YAML). `just test-native` runs the suite once per channel.
name = "solex-native-tests"
default_channel = "stable"

[channels.stable]
program_id = "11111111111111111111111111111111"
cluster = "localnet"
vars = { treasury = "stable-treasury" }

[channels.nightly]
includes = ["stable"]
program_id = "TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA"
cluster = "localnet"
vars = { treasury = "nightly-treasury" }

[channels.canary]
includes = ["nightly"]
program_id = "Sysvar1111111111111111111111111111111111111"
cluster = "localnet"
vars = { treasury = "canary-treasury" }

[features.hooks]
description = "lifecycle hooks under test"
channels = ["nightly"]
epoch = { canary = 5 }
